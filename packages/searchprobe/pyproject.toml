[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "searchprobe"
version = "0.1.0"
description = "Audit black-box search probes before and after retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/yzzhu-ron/outer_loop/tree/codex/search-environment-exploration-proposal/packages/searchprobe"
Documentation = "https://github.com/yzzhu-ron/outer_loop/blob/codex/search-environment-exploration-proposal/packages/searchprobe/README.md"
Source = "https://github.com/yzzhu-ron/outer_loop/tree/codex/search-environment-exploration-proposal/packages/searchprobe/src/searchprobe"
Issues = "https://github.com/yzzhu-ron/outer_loop/issues"

[project.scripts]
searchprobe = "searchprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
