name: searchprobe

"on":
  push:
    paths:
      - "packages/searchprobe/**"
      - "papers/learning-to-explore-search-environments/full_paper/**"
      - "papers/learning-to-explore-search-environments/semantic_pilot/results/**"
      - "pyproject.toml"
      - ".github/workflows/searchprobe.yml"
  pull_request:
    paths:
      - "packages/searchprobe/**"
      - "papers/learning-to-explore-search-environments/full_paper/**"
      - "papers/learning-to-explore-search-environments/semantic_pilot/results/**"
      - "pyproject.toml"
      - ".github/workflows/searchprobe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the dependency-free test suite
        env:
          PYTHONPATH: packages/searchprobe/src
        run: python -m unittest discover -s packages/searchprobe/tests -v
      - name: Test portable evidence replay and exact research examples
        env:
          PYTHONPATH: packages/searchprobe/src
        run: |
          python -m unittest discover -s papers/learning-to-explore-search-environments/full_paper/replay/tests -v
          python -m unittest discover -s papers/learning-to-explore-search-environments/full_paper/theory -p 'test_workload_design.py' -v
          python -m unittest discover -s papers/learning-to-explore-search-environments/full_paper/controlled -p 'test_*.py' -v
          python papers/learning-to-explore-search-environments/full_paper/validate_blog.py
      - name: Build and install a wheel
        if: matrix.python == '3.12'
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel packages/searchprobe
          python -m pip install --no-deps packages/searchprobe/dist/*.whl
      - name: Smoke-test all three installed commands
        if: matrix.python == '3.12'
        run: |
          searchprobe audit packages/searchprobe/examples/synthetic.jsonl --output "$RUNNER_TEMP/searchprobe-probes.json"
          searchprobe decision-audit packages/searchprobe/examples/source_model_synthetic.json --output "$RUNNER_TEMP/searchprobe-decisions.json"
          searchprobe response-audit packages/searchprobe/examples/response_model.json --output "$RUNNER_TEMP/searchprobe-response.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          probes = json.loads((root / "searchprobe-probes.json").read_text())
          decisions = json.loads((root / "searchprobe-decisions.json").read_text())
          response = json.loads((root / "searchprobe-response.json").read_text())
          assert probes["counts"]["valid_records"] == 5
          assert probes["counts"]["exact_identical_query_pairs"] == 1
          assert decisions["decision_radius"]["exact"] == "1/3"
          assert decisions["certificate"]["duality_gap"]["exact"] == "0"
          assert decisions["target_regret_guarantee"] is False
          assert response["unchanged_fraction"]["exact"] == "1/3"
          assert response["mean_utility_change_bound"]["absolute_upper_bound"]["exact"] == "2/3"
          assert response["bound_validity_verified"] is False
          PY
      - name: Test installed examples and replay outside the checkout
        if: matrix.python == '3.12'
        run: python papers/learning-to-explore-search-environments/full_paper/replay/smoke_installed.py --python "$(command -v python)"

  research:
    name: Development analysis checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install numpy scipy scikit-learn
      - name: Test source and target boundaries, costs, and numerical audits
        run: |
          python -m unittest discover -s papers/learning-to-explore-search-environments/full_paper/natural -p 'test_*.py' -v
          python -m unittest discover -s papers/learning-to-explore-search-environments/full_paper/fusion_frontier -p 'test_*.py' -v
          python -m unittest discover -s papers/learning-to-explore-search-environments/full_paper/theory -p 'test_channel_diagnostics.py' -v
          python -m unittest discover -s papers/learning-to-explore-search-environments/full_paper/query_transfer -p 'test_*.py' -v
          python -m unittest discover -s papers/learning-to-explore-search-environments/full_paper/interventions -p 'test_adapter.py' -v
